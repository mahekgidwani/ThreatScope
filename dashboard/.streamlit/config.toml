# Run from this folder: `streamlit run app.py`. Local only: bound to the loopback address, never 0.0.0.0.
[server]
address = "127.0.0.1"
port = 8501
headless = true
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#111A2B"
textColor = "#E6EDF7"
font = "sans serif"
